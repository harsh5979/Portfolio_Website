<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675">
  <defs>
    <linearGradient id="web3-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e0f17"/>
      <stop offset="50%" stop-color="#141724"/>
      <stop offset="100%" stop-color="#1b1c31"/>
    </linearGradient>
    <linearGradient id="web3-card" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#191b2c"/>
      <stop offset="100%" stop-color="#11121e"/>
    </linearGradient>
    <pattern id="web3-grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#25283f" stroke-width="0.75" stroke-opacity="0.5"/>
    </pattern>
  </defs>

  <rect width="1200" height="675" fill="url(#web3-bg)"/>
  <rect width="1200" height="675" fill="url(#web3-grid)"/>

  <!-- Top Title Bar -->
  <rect x="40" y="30" width="1120" height="60" rx="10" fill="#121320" stroke="#25283f" stroke-width="1.5"/>
  <circle cx="70" cy="60" r="6" fill="#ef4444"/>
  <circle cx="92" cy="60" r="6" fill="#f59e0b"/>
  <circle cx="114" cy="60" r="6" fill="#10b981"/>
  <text x="145" y="65" fill="#818cf8" font-family="monospace" font-size="14" font-weight="600">blockchain-freelance // TRUSTLESS ESCROW DAPP &amp; SOLIDITY CONTRACTS</text>
  <rect x="910" y="45" width="230" height="30" rx="6" fill="#6366f1" fill-opacity="0.2" stroke="#6366f1" stroke-width="1"/>
  <text x="930" y="65" fill="#a5b4fc" font-family="monospace" font-size="12" font-weight="700">● ETHEREUM SEPOLIA</text>

  <!-- Escrow Lifecycle State Machine Flow -->
  <g transform="translate(40, 110)">
    <rect width="1120" height="240" rx="12" fill="url(#web3-card)" stroke="#25283f" stroke-width="1.5"/>
    <text x="30" y="35" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="18" font-weight="700">Smart Contract Milestone Escrow State Machine</text>
    <text x="30" y="58" fill="#a5b4fc" font-family="monospace" font-size="12">Contract: EscrowEngine.sol // Multi-Signature Dispute-Free Settlement</text>

    <!-- State 1 -->
    <g transform="translate(35, 80)">
      <rect width="210" height="130" rx="8" fill="#0c0d16" stroke="#6366f1" stroke-width="1.5"/>
      <text x="20" y="30" fill="#a5b4fc" font-family="monospace" font-size="12">STATE 01 // DEPOSIT</text>
      <text x="20" y="55" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="14" font-weight="700">Client Locks Funds</text>
      <text x="20" y="80" fill="#94a3b8" font-family="monospace" font-size="11">Deposit: 1.50 ETH</text>
      <text x="20" y="102" fill="#34d399" font-family="monospace" font-size="11">✓ In Escrow Vault</text>
    </g>

    <!-- Arrow 1 -->
    <path d="M 255 145 L 295 145" stroke="#6366f1" stroke-width="2" stroke-dasharray="4,4"/>
    <polygon points="295,141 303,145 295,149" fill="#6366f1"/>

    <!-- State 2 -->
    <g transform="translate(315, 80)">
      <rect width="210" height="130" rx="8" fill="#0c0d16" stroke="#0ea5e9" stroke-width="1.5"/>
      <text x="20" y="30" fill="#38bdf8" font-family="monospace" font-size="12">STATE 02 // SUBMIT</text>
      <text x="20" y="55" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="14" font-weight="700">Freelancer Delivery</text>
      <text x="20" y="80" fill="#94a3b8" font-family="monospace" font-size="11">IPFS Hash: QmXyZ9...</text>
      <text x="20" y="102" fill="#38bdf8" font-family="monospace" font-size="11">Milestone 1 Complete</text>
    </g>

    <!-- Arrow 2 -->
    <path d="M 535 145 L 575 145" stroke="#0ea5e9" stroke-width="2" stroke-dasharray="4,4"/>
    <polygon points="575,141 583,145 575,149" fill="#0ea5e9"/>

    <!-- State 3 -->
    <g transform="translate(595, 80)">
      <rect width="210" height="130" rx="8" fill="#0c0d16" stroke="#f59e0b" stroke-width="1.5"/>
      <text x="20" y="30" fill="#fbbf24" font-family="monospace" font-size="12">STATE 03 // REVIEW</text>
      <text x="20" y="55" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="14" font-weight="700">Client Code Audit</text>
      <text x="20" y="80" fill="#94a3b8" font-family="monospace" font-size="11">Timelock: 48 Hours</text>
      <text x="20" y="102" fill="#fbbf24" font-family="monospace" font-size="11">Automatic Release Guard</text>
    </g>

    <!-- Arrow 3 -->
    <path d="M 815 145 L 855 145" stroke="#f59e0b" stroke-width="2" stroke-dasharray="4,4"/>
    <polygon points="855,141 863,145 855,149" fill="#f59e0b"/>

    <!-- State 4 -->
    <g transform="translate(875, 80)">
      <rect width="210" height="130" rx="8" fill="#0c0d16" stroke="#10b981" stroke-width="1.5"/>
      <text x="20" y="30" fill="#34d399" font-family="monospace" font-size="12">STATE 04 // RELEASE</text>
      <text x="20" y="55" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="14" font-weight="700">Settled to Wallet</text>
      <text x="20" y="80" fill="#94a3b8" font-family="monospace" font-size="11">Fee: 0% Platform Cut</text>
      <text x="20" y="102" fill="#34d399" font-family="monospace" font-size="11">Tx Confirmed (Block 629)</text>
    </g>
  </g>

  <!-- Lower Section: Web3 Wallet & On-Chain Audit Feed -->
  <g transform="translate(40, 370)">
    <!-- Terminal Logs -->
    <rect width="660" height="265" rx="10" fill="#07080f" stroke="#25283f" stroke-width="1.5"/>
    <rect width="660" height="32" rx="10" fill="#121320"/>
    <text x="20" y="21" fill="#818cf8" font-family="monospace" font-size="11">web3-events // Sepolia Testnet RPC Stream</text>
    <text x="20" y="62" fill="#38bdf8" font-family="monospace" font-size="12">[MetaMask] Connected account: 0x71C...49b2 (Network: Sepolia 11155111)</text>
    <text x="20" y="88" fill="#94a3b8" font-family="monospace" font-size="12">[Contract] EscrowCreated(escrowId=841, client=0x71C, freelancer=0x38A)</text>
    <text x="20" y="114" fill="#a5b4fc" font-family="monospace" font-size="12">[Deposit] 1.5000 ETH locked in contract vault: 0x909Fe...871</text>
    <text x="20" y="140" fill="#f59e0b" font-family="monospace" font-size="12">[IPFS] Deliverable proof pinned: ipfs://bafybeigdyrzt5sfp7...</text>
    <text x="20" y="166" fill="#10b981" font-family="monospace" font-size="12">[ReleaseFunds] Milestone 1 approved. Gas used: 48,219 units</text>
    <text x="20" y="192" fill="#34d399" font-family="monospace" font-size="12">✓ Zero intermediary commission deducted // 100% value delivered</text>

    <!-- Side Wallet / Stats Card -->
    <g transform="translate(690, 0)">
      <rect width="430" height="265" rx="10" fill="url(#web3-card)" stroke="#25283f" stroke-width="1.5"/>
      <text x="25" y="35" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="16" font-weight="700">Contract Security &amp; Gas Optimization</text>

      <g transform="translate(25, 55)">
        <rect width="180" height="85" rx="6" fill="#0b0c15" stroke="#25283f"/>
        <text x="15" y="25" fill="#818cf8" font-family="monospace" font-size="11">GAS EFFICIENCY</text>
        <text x="15" y="55" fill="#34d399" font-family="monospace" font-size="22" font-weight="700">&lt;52k Gas</text>
        <text x="15" y="75" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">Storage slot packing</text>
      </g>

      <g transform="translate(225, 55)">
        <rect width="180" height="85" rx="6" fill="#0b0c15" stroke="#25283f"/>
        <text x="15" y="25" fill="#818cf8" font-family="monospace" font-size="11">ESCROW VOLUME</text>
        <text x="15" y="55" fill="#38bdf8" font-family="monospace" font-size="22" font-weight="700">12.8 ETH</text>
        <text x="15" y="75" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">Testnet pilot trials</text>
      </g>

      <g transform="translate(25, 160)">
        <rect width="380" height="85" rx="6" fill="#0b0c15" stroke="#25283f"/>
        <text x="20" y="30" fill="#a5b4fc" font-family="monospace" font-size="11">SECURITY AUDIT CHECKS</text>
        <text x="20" y="55" fill="#10b981" font-family="system-ui, sans-serif" font-size="13" font-weight="600">ReentrancyGuard &amp; Checks-Effects-Interactions</text>
        <text x="20" y="75" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">Zero reentrancy vulnerability or overflow vectors</text>
      </g>
    </g>
  </g>
</svg>
