<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675">
  <defs>
    <linearGradient id="ai-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c0a17"/>
      <stop offset="50%" stop-color="#120e24"/>
      <stop offset="100%" stop-color="#181330"/>
    </linearGradient>
    <linearGradient id="ai-card" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1a1435"/>
      <stop offset="100%" stop-color="#120d26"/>
    </linearGradient>
    <pattern id="ai-grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#2a1f4e" stroke-width="0.75" stroke-opacity="0.5"/>
    </pattern>
  </defs>

  <rect width="1200" height="675" fill="url(#ai-bg)"/>
  <rect width="1200" height="675" fill="url(#ai-grid)"/>

  <!-- Top Title / Terminal Bar -->
  <rect x="40" y="30" width="1120" height="60" rx="10" fill="#130e28" stroke="#2c1f52" stroke-width="1.5"/>
  <circle cx="70" cy="60" r="6" fill="#ef4444"/>
  <circle cx="92" cy="60" r="6" fill="#f59e0b"/>
  <circle cx="114" cy="60" r="6" fill="#10b981"/>
  <text x="145" y="65" fill="#c084fc" font-family="monospace" font-size="14" font-weight="600">AI-Text-Image-Detector // MULTIMODAL SYNTHETIC MEDIA CLASSIFIER</text>
  <rect x="910" y="45" width="230" height="30" rx="6" fill="#8b5cf6" fill-opacity="0.2" stroke="#8b5cf6" stroke-width="1"/>
  <text x="930" y="65" fill="#c084fc" font-family="monospace" font-size="12" font-weight="700">● OLLAMA + OPENAI API</text>

  <!-- Left: Text Analysis Workspace -->
  <g transform="translate(40, 110)">
    <rect width="540" height="525" rx="12" fill="url(#ai-card)" stroke="#2c1f52" stroke-width="1.5"/>
    <text x="30" y="40" fill="#f5f3ff" font-family="system-ui, sans-serif" font-size="18" font-weight="700">NLP Text Perplexity &amp; Burstiness Scanner</text>
    <text x="30" y="65" fill="#a78bfa" font-family="monospace" font-size="12">Llama-3 / GPT-4 Token Probability Matrix</text>

    <!-- Text input preview box -->
    <rect x="30" y="90" width="480" height="150" rx="8" fill="#0d091e" stroke="#2c1f52" stroke-width="1"/>
    <text x="45" y="120" fill="#e2e8f0" font-family="monospace" font-size="12">"The continuous advancement of autonomous deep</text>
    <text x="45" y="142" fill="#c084fc" font-family="monospace" font-size="12" font-weight="600">learning algorithms has revolutionized contemporary</text>
    <text x="45" y="164" fill="#e2e8f0" font-family="monospace" font-size="12">computational engineering paradigms, providing novel</text>
    <text x="45" y="186" fill="#e2e8f0" font-family="monospace" font-size="12">frameworks for multi-agent synthesis."</text>
    <text x="45" y="222" fill="#38bdf8" font-family="monospace" font-size="11">42 Tokens Processed // Context Window: 4096</text>

    <!-- Metrics Gauges -->
    <g transform="translate(30, 260)">
      <rect width="230" height="110" rx="8" fill="#0d091e" stroke="#2c1f52"/>
      <text x="15" y="30" fill="#a78bfa" font-family="monospace" font-size="11">PERPLEXITY SCORE</text>
      <text x="15" y="68" fill="#38bdf8" font-family="monospace" font-size="28" font-weight="700">14.2 PPL</text>
      <text x="15" y="95" fill="#f43f5e" font-family="monospace" font-size="11">Low Entropy (Synthetic)</text>

      <rect x="250" width="230" height="110" rx="8" fill="#0d091e" stroke="#2c1f52"/>
      <text x="15" y="30" fill="#a78bfa" font-family="monospace" font-size="11">BURSTINESS INDEX</text>
      <text x="15" y="68" fill="#10b981" font-family="monospace" font-size="28" font-weight="700">0.18 B-IDX</text>
      <text x="15" y="95" fill="#f43f5e" font-family="monospace" font-size="11">Uniform Sentence Length</text>
    </g>

    <!-- Final Result Bar -->
    <g transform="translate(30, 390)">
      <rect width="480" height="105" rx="8" fill="#240c1e" stroke="#f43f5e" stroke-width="1.5"/>
      <text x="25" y="35" fill="#fda4af" font-family="system-ui, sans-serif" font-size="14" font-weight="700">Classification: 96.8% Likely AI-Generated</text>
      <rect x="25" y="55" width="430" height="10" rx="5" fill="#4c0519"/>
      <rect x="25" y="55" width="416" height="10" rx="5" fill="#f43f5e"/>
      <text x="25" y="85" fill="#fecdd3" font-family="monospace" font-size="11">Primary Model Signature: Ollama local llama3:8b</text>
    </g>
  </g>

  <!-- Right: Computer Vision & Artifact Heatmap -->
  <g transform="translate(610, 110)">
    <rect width="550" height="525" rx="12" fill="url(#ai-card)" stroke="#2c1f52" stroke-width="1.5"/>
    <text x="30" y="40" fill="#f5f3ff" font-family="system-ui, sans-serif" font-size="18" font-weight="700">Vision CNN Diffusion &amp; Artifact Heatmap</text>
    <text x="30" y="65" fill="#a78bfa" font-family="monospace" font-size="12">Pixel frequency gradient &amp; spectral inconsistency analysis</text>

    <!-- Image Heatmap Preview -->
    <g transform="translate(30, 90)">
      <rect width="490" height="240" rx="8" fill="#0d091e" stroke="#2c1f52" stroke-width="1"/>

      <!-- Mock face / graphic contour -->
      <circle cx="160" cy="120" r="70" fill="#1e133d" stroke="#8b5cf6" stroke-width="1.5"/>
      <circle cx="135" cy="105" r="10" fill="#06b6d4"/>
      <circle cx="185" cy="105" r="10" fill="#06b6d4"/>
      <path d="M 140 145 Q 160 165 180 145" stroke="#f43f5e" stroke-width="2" fill="none"/>

      <!-- Heatmap anomaly overlay nodes -->
      <circle cx="215" cy="85" r="18" fill="#f43f5e" fill-opacity="0.5"/>
      <circle cx="215" cy="85" r="8" fill="#f43f5e"/>
      <line x1="235" y1="85" x2="310" y2="70" stroke="#f43f5e" stroke-width="1.5" stroke-dasharray="3,3"/>
      <text x="320" y="74" fill="#fda4af" font-family="monospace" font-size="11">Ear asymmetry anomaly</text>

      <circle cx="160" cy="180" r="18" fill="#f59e0b" fill-opacity="0.5"/>
      <circle cx="160" cy="180" r="8" fill="#f59e0b"/>
      <line x1="180" y1="180" x2="310" y2="150" stroke="#f59e0b" stroke-width="1.5" stroke-dasharray="3,3"/>
      <text x="320" y="154" fill="#fde68a" font-family="monospace" font-size="11">Fourier spectral halo</text>

      <circle cx="100" cy="120" r="16" fill="#f43f5e" fill-opacity="0.5"/>
      <circle cx="100" cy="120" r="8" fill="#f43f5e"/>
      <line x1="118" y1="120" x2="310" y2="210" stroke="#f43f5e" stroke-width="1.5" stroke-dasharray="3,3"/>
      <text x="320" y="214" fill="#fda4af" font-family="monospace" font-size="11">Diffusion noise residue</text>
    </g>

    <!-- Vision Pipeline Breakdown -->
    <g transform="translate(30, 350)">
      <rect width="490" height="145" rx="8" fill="#0d091e" stroke="#2c1f52" stroke-width="1"/>
      <text x="20" y="28" fill="#c084fc" font-family="monospace" font-size="12">// Deep Learning Multimodal Pipeline</text>
      <text x="20" y="55" fill="#f1f5f9" font-family="system-ui, sans-serif" font-size="13">1. Fast Ingestion: Express.js streaming body parser</text>
      <text x="20" y="80" fill="#f1f5f9" font-family="system-ui, sans-serif" font-size="13">2. Dual Evaluation: Local Ollama (offline) + OpenAI GPT-4 Vision</text>
      <text x="20" y="105" fill="#f1f5f9" font-family="system-ui, sans-serif" font-size="13">3. Weighted Ensemble scoring with sub-1.8s response time</text>
      <text x="20" y="130" fill="#10b981" font-family="monospace" font-size="11">✓ Verified on 5,000+ benchmark synthetic test vectors</text>
    </g>
  </g>
</svg>
