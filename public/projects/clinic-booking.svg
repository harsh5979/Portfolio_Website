<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675">
  <defs>
    <linearGradient id="clinic-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#091418"/>
      <stop offset="50%" stop-color="#0e1f26"/>
      <stop offset="100%" stop-color="#142c37"/>
    </linearGradient>
    <linearGradient id="clinic-card" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#132a35"/>
      <stop offset="100%" stop-color="#0d1c24"/>
    </linearGradient>
    <pattern id="clinic-grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#1c3d4d" stroke-width="0.75" stroke-opacity="0.5"/>
    </pattern>
  </defs>

  <rect width="1200" height="675" fill="url(#clinic-bg)"/>
  <rect width="1200" height="675" fill="url(#clinic-grid)"/>

  <!-- Top Title / Terminal Bar -->
  <rect x="40" y="30" width="1120" height="60" rx="10" fill="#0e1c24" stroke="#1c3d4d" stroke-width="1.5"/>
  <circle cx="70" cy="60" r="6" fill="#ef4444"/>
  <circle cx="92" cy="60" r="6" fill="#f59e0b"/>
  <circle cx="114" cy="60" r="6" fill="#10b981"/>
  <text x="145" y="65" fill="#38bdf8" font-family="monospace" font-size="14" font-weight="600">clinic-appointment-booking // HEALTHCARE QUEUE &amp; APPOINTMENT SCHEDULING</text>
  <rect x="910" y="45" width="230" height="30" rx="6" fill="#0ea5e9" fill-opacity="0.15" stroke="#0ea5e9" stroke-width="1"/>
  <text x="930" y="65" fill="#38bdf8" font-family="monospace" font-size="12" font-weight="700">● REACT + ZUSTAND + RAZORPAY</text>

  <!-- Left: Interactive Doctor Slot Scheduler -->
  <g transform="translate(40, 110)">
    <rect width="640" height="525" rx="12" fill="url(#clinic-card)" stroke="#1c3d4d" stroke-width="1.5"/>
    <text x="30" y="40" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="18" font-weight="700">Doctor Availability Calendar &amp; Slot Engine</text>
    <text x="30" y="65" fill="#7dd3fc" font-family="monospace" font-size="12">Real-Time State Managed via Zustand // Zero Overbooking Guarantee</text>

    <!-- Doctor Profile Header -->
    <g transform="translate(30, 90)">
      <rect width="580" height="80" rx="8" fill="#08141a" stroke="#1c3d4d"/>
      <circle cx="45" cy="40" r="24" fill="#0ea5e9" fill-opacity="0.2"/>
      <text x="35" y="46" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="18" font-weight="700">Dr</text>
      <text x="85" y="35" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="15" font-weight="600">Dr. Rajesh Mehta, MD</text>
      <text x="85" y="55" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12">Cardiology Specialist // Consultation Room 204</text>
      <rect x="450" y="25" width="105" height="30" rx="6" fill="#10b981" fill-opacity="0.15" stroke="#10b981" stroke-width="1"/>
      <text x="468" y="44" fill="#34d399" font-family="monospace" font-size="11" font-weight="700">AVAILABLE</text>
    </g>

    <!-- Slot Matrix (Date / Time slots) -->
    <g transform="translate(30, 190)">
      <text x="0" y="20" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="14" font-weight="600">Available Time Slots (Today, 14:00 - 18:00)</text>

      <g transform="translate(0, 35)">
        <!-- Slot 1 (Booked) -->
        <rect x="0" y="0" width="135" height="55" rx="6" fill="#08141a" stroke="#334155"/>
        <text x="15" y="25" fill="#64748b" font-family="monospace" font-size="12">14:00 - 14:30</text>
        <text x="15" y="44" fill="#ef4444" font-family="monospace" font-size="10">BOOKED</text>

        <!-- Slot 2 (Selected) -->
        <rect x="150" y="0" width="135" height="55" rx="6" fill="#0c4a6e" stroke="#38bdf8" stroke-width="1.5"/>
        <text x="165" y="25" fill="#f8fafc" font-family="monospace" font-size="12" font-weight="700">14:30 - 15:00</text>
        <text x="165" y="44" fill="#38bdf8" font-family="monospace" font-size="10">SELECTED</text>

        <!-- Slot 3 (Available) -->
        <rect x="300" y="0" width="135" height="55" rx="6" fill="#08141a" stroke="#10b981"/>
        <text x="315" y="25" fill="#f8fafc" font-family="monospace" font-size="12">15:00 - 15:30</text>
        <text x="315" y="44" fill="#34d399" font-family="monospace" font-size="10">AVAILABLE</text>

        <!-- Slot 4 (Available) -->
        <rect x="445" y="0" width="135" height="55" rx="6" fill="#08141a" stroke="#10b981"/>
        <text x="460" y="25" fill="#f8fafc" font-family="monospace" font-size="12">15:30 - 16:00</text>
        <text x="460" y="44" fill="#34d399" font-family="monospace" font-size="10">AVAILABLE</text>
      </g>
    </g>

    <!-- Patient Booking Flow Stepper -->
    <g transform="translate(30, 310)">
      <rect width="580" height="90" rx="8" fill="#08141a" stroke="#1c3d4d"/>
      <text x="20" y="30" fill="#94a3b8" font-family="monospace" font-size="11">STEP 3 OF 4: PATIENT DETAILS &amp; MEDICAL HISTORY</text>
      <text x="20" y="55" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="13">Patient: Suresh Varma (Age: 48) // Token: #CL-104</text>
      <text x="20" y="75" fill="#34d399" font-family="monospace" font-size="11">✓ Electronic queue position calculated automatically (ETA: 14:30)</text>
    </g>

    <!-- Bottom summary status -->
    <g transform="translate(30, 420)">
      <rect width="580" height="75" rx="8" fill="#08141a" stroke="#1c3d4d"/>
      <text x="20" y="28" fill="#7dd3fc" font-family="monospace" font-size="11">// Dual Payment Processor Support</text>
      <text x="20" y="52" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="12">Instant online Razorpay pre-pay or on-site reception counter payment settlement.</text>
    </g>
  </g>

  <!-- Right: Queue Status & Doctor Portal View -->
  <g transform="translate(710, 110)">
    <rect width="450" height="525" rx="12" fill="url(#clinic-card)" stroke="#1c3d4d" stroke-width="1.5"/>
    <text x="30" y="40" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="18" font-weight="700">Electronic Queue Display</text>
    <text x="30" y="65" fill="#7dd3fc" font-family="monospace" font-size="12">Live reception TV &amp; mobile web token tracker</text>

    <!-- Current Serving Token -->
    <g transform="translate(30, 90)">
      <rect width="390" height="150" rx="10" fill="#08141a" stroke="#38bdf8" stroke-width="2"/>
      <text x="25" y="35" fill="#7dd3fc" font-family="monospace" font-size="12">NOW CONSULTING IN ROOM 204</text>
      <text x="25" y="95" fill="#38bdf8" font-family="monospace" font-size="52" font-weight="700">#CL-102</text>
      <text x="25" y="130" fill="#34d399" font-family="system-ui, sans-serif" font-size="12">Status: In Progress // 8 mins elapsed</text>
    </g>

    <!-- Upcoming Queue -->
    <g transform="translate(30, 260)">
      <rect width="390" height="130" rx="8" fill="#08141a" stroke="#1c3d4d"/>
      <text x="20" y="30" fill="#94a3b8" font-family="monospace" font-size="11">UPCOMING IN QUEUE</text>

      <g transform="translate(20, 45)">
        <text x="0" y="20" fill="#f8fafc" font-family="monospace" font-size="13" font-weight="600">#CL-103</text>
        <text x="80" y="20" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12">Meera Nair</text>
        <text x="250" y="20" fill="#f59e0b" font-family="monospace" font-size="11">Waiting (3m)</text>
      </g>

      <g transform="translate(20, 80)">
        <text x="0" y="20" fill="#38bdf8" font-family="monospace" font-size="13" font-weight="600">#CL-104</text>
        <text x="80" y="20" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="12">Suresh Varma (You)</text>
        <text x="250" y="20" fill="#34d399" font-family="monospace" font-size="11">Next in Line</text>
      </g>
    </g>

    <!-- Operational KPI -->
    <g transform="translate(30, 410)">
      <rect width="390" height="85" rx="8" fill="#08141a" stroke="#1c3d4d"/>
      <text x="20" y="30" fill="#94a3b8" font-family="monospace" font-size="11">AVERAGE PATIENT WAIT TIME</text>
      <text x="20" y="62" fill="#34d399" font-family="monospace" font-size="26" font-weight="700">11.4 mins</text>
      <text x="170" y="62" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12">Down from 45m legacy paper queue</text>
    </g>
  </g>
</svg>
