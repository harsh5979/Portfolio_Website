<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675">
  <defs>
    <linearGradient id="iot-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a1410"/>
      <stop offset="50%" stop-color="#0f201a"/>
      <stop offset="100%" stop-color="#142c23"/>
    </linearGradient>
    <linearGradient id="iot-card" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#142b23"/>
      <stop offset="100%" stop-color="#0d1f19"/>
    </linearGradient>
    <pattern id="iot-grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#1c3d31" stroke-width="0.75" stroke-opacity="0.5"/>
    </pattern>
  </defs>

  <rect width="1200" height="675" fill="url(#iot-bg)"/>
  <rect width="1200" height="675" fill="url(#iot-grid)"/>

  <!-- Header Bar -->
  <rect x="40" y="30" width="1120" height="60" rx="10" fill="#0c1d17" stroke="#1b3d32" stroke-width="1.5"/>
  <circle cx="70" cy="60" r="6" fill="#ef4444"/>
  <circle cx="92" cy="60" r="6" fill="#f59e0b"/>
  <circle cx="114" cy="60" r="6" fill="#10b981"/>
  <text x="145" y="65" fill="#6ee7b7" font-family="monospace" font-size="14" font-weight="600">Home-Automation--System // ESP8266 FIRMWARE &amp; IOT TELEMETRY</text>
  <rect x="920" y="45" width="220" height="30" rx="6" fill="#10b981" fill-opacity="0.15" stroke="#10b981" stroke-width="1"/>
  <text x="940" y="65" fill="#34d399" font-family="monospace" font-size="12" font-weight="700">● REAL-TIME WEBSOCKET</text>

  <!-- Left: ESP8266 Microcontroller Circuit & Pinout Architecture -->
  <g transform="translate(40, 110)">
    <rect width="560" height="525" rx="12" fill="url(#iot-card)" stroke="#1b3d32" stroke-width="1.5"/>
    <text x="30" y="40" fill="#ecfdf5" font-family="system-ui, sans-serif" font-size="18" font-weight="700">ESP8266 NodeMCU Hardware Layer</text>
    <text x="30" y="65" fill="#6ee7b7" font-family="monospace" font-size="12">802.11 b/g/n WiFi SoC // GPIO Optocoupler Relays</text>

    <!-- Microcontroller Chip Vector -->
    <g transform="translate(60, 95)">
      <rect width="200" height="260" rx="8" fill="#06120e" stroke="#10b981" stroke-width="2"/>
      <rect x="25" y="25" width="150" height="150" rx="6" fill="#0f261e" stroke="#059669"/>
      <text x="45" y="100" fill="#a7f3d0" font-family="monospace" font-size="16" font-weight="700">ESP8266</text>
      <text x="45" y="125" fill="#34d399" font-family="monospace" font-size="11">Tensilica L106</text>
      <text x="45" y="145" fill="#6ee7b7" font-family="monospace" font-size="10">80 MHz / 4MB Flash</text>

      <!-- Antenna trace -->
      <path d="M 40 10 L 40 25 M 60 10 L 60 25 M 80 10 L 80 25 M 100 10 L 100 25 M 120 10 L 120 25 M 140 10 L 140 25 M 160 10 L 160 25" stroke="#34d399" stroke-width="2"/>

      <!-- Pins Left -->
      <rect x="-15" y="40" width="15" height="8" fill="#94a3b8"/>
      <rect x="-15" y="70" width="15" height="8" fill="#94a3b8"/>
      <rect x="-15" y="100" width="15" height="8" fill="#94a3b8"/>
      <rect x="-15" y="130" width="15" height="8" fill="#94a3b8"/>
      <rect x="-15" y="160" width="15" height="8" fill="#94a3b8"/>

      <!-- Pins Right -->
      <rect x="200" y="40" width="15" height="8" fill="#94a3b8"/>
      <rect x="200" y="70" width="15" height="8" fill="#94a3b8"/>
      <rect x="200" y="100" width="15" height="8" fill="#94a3b8"/>
      <rect x="200" y="130" width="15" height="8" fill="#94a3b8"/>
      <rect x="200" y="160" width="15" height="8" fill="#94a3b8"/>
    </g>

    <!-- Traces and Relays -->
    <g transform="translate(300, 95)">
      <text x="10" y="25" fill="#a7f3d0" font-family="system-ui, sans-serif" font-size="14" font-weight="600">4-Channel Optocoupled Relays</text>

      <!-- Relay 1 -->
      <rect x="10" y="40" width="220" height="50" rx="6" fill="#091813" stroke="#10b981" stroke-width="1"/>
      <circle cx="30" cy="65" r="8" fill="#10b981"/>
      <text x="50" y="62" fill="#ecfdf5" font-family="system-ui, sans-serif" font-size="12" font-weight="600">GPIO 04: Living Room Lights</text>
      <text x="50" y="78" fill="#34d399" font-family="monospace" font-size="11">STATE: ON (45W)</text>

      <!-- Relay 2 -->
      <rect x="10" y="100" width="220" height="50" rx="6" fill="#091813" stroke="#10b981" stroke-width="1"/>
      <circle cx="30" cy="125" r="8" fill="#10b981"/>
      <text x="50" y="122" fill="#ecfdf5" font-family="system-ui, sans-serif" font-size="12" font-weight="600">GPIO 05: AC Inverter Unit</text>
      <text x="50" y="138" fill="#34d399" font-family="monospace" font-size="11">STATE: ON (1,150W)</text>

      <!-- Relay 3 -->
      <rect x="10" y="160" width="220" height="50" rx="6" fill="#091813" stroke="#334155" stroke-width="1"/>
      <circle cx="30" cy="185" r="8" fill="#475569"/>
      <text x="50" y="182" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12" font-weight="600">GPIO 12: Exhaust Fan</text>
      <text x="50" y="198" fill="#64748b" font-family="monospace" font-size="11">STATE: OFF (0W)</text>

      <!-- Relay 4 -->
      <rect x="10" y="220" width="220" height="50" rx="6" fill="#091813" stroke="#10b981" stroke-width="1"/>
      <circle cx="30" cy="245" r="8" fill="#10b981"/>
      <text x="50" y="242" fill="#ecfdf5" font-family="system-ui, sans-serif" font-size="12" font-weight="600">GPIO 14: Water Boiler Relay</text>
      <text x="50" y="258" fill="#34d399" font-family="monospace" font-size="11">STATE: ON (Timer: 14m)</text>
    </g>

    <!-- Bottom Telemetry specs -->
    <g transform="translate(30, 390)">
      <rect width="500" height="105" rx="8" fill="#071510" stroke="#1b3d32" stroke-width="1"/>
      <text x="20" y="28" fill="#6ee7b7" font-family="monospace" font-size="11">// EEPROM &amp; Persistent State Guard</text>
      <text x="20" y="55" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="12">Persistent relay state retained across power cuts with EEPROM cache.</text>
      <text x="20" y="78" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="12">Local mDNS discovery (`esp8266.local`) for offline fallback operation.</text>
    </g>
  </g>

  <!-- Right: Responsive Web Dashboard & Real-Time Stats -->
  <g transform="translate(630, 110)">
    <rect width="530" height="525" rx="12" fill="url(#iot-card)" stroke="#1b3d32" stroke-width="1.5"/>
    <text x="30" y="40" fill="#ecfdf5" font-family="system-ui, sans-serif" font-size="18" font-weight="700">Real-Time Cloud Telemetry UI</text>
    <text x="30" y="65" fill="#6ee7b7" font-family="monospace" font-size="12">Sub-80ms WebSocket broadcast latency</text>

    <!-- Metrics Cards -->
    <g transform="translate(30, 95)">
      <rect width="220" height="100" rx="8" fill="#071510" stroke="#1b3d32"/>
      <text x="20" y="30" fill="#6ee7b7" font-family="monospace" font-size="11">ACTIVE LOAD</text>
      <text x="20" y="68" fill="#34d399" font-family="monospace" font-size="30" font-weight="700">1,245 W</text>
      <text x="20" y="90" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">Within safe threshold</text>

      <rect x="245" width="220" height="100" rx="8" fill="#071510" stroke="#1b3d32"/>
      <text x="265" y="30" fill="#6ee7b7" font-family="monospace" font-size="11">PING LATENCY</text>
      <text x="265" y="68" fill="#38bdf8" font-family="monospace" font-size="30" font-weight="700">18 ms</text>
      <text x="265" y="90" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">Local WiFi Relay</text>
    </g>

    <!-- Waveform / Power History Chart -->
    <g transform="translate(30, 220)">
      <rect width="470" height="150" rx="8" fill="#071510" stroke="#1b3d32"/>
      <text x="20" y="25" fill="#94a3b8" font-family="monospace" font-size="11">LIVE POWER CONSUMPTION OSCILLATION (24H)</text>
      <path d="M 20 120 L 70 115 L 120 125 L 170 90 L 220 80 L 270 95 L 320 60 L 370 75 L 420 50 L 460 55" fill="none" stroke="#10b981" stroke-width="2.5"/>
      <line x1="20" y1="130" x2="460" y2="130" stroke="#1b3d32" stroke-width="1"/>
      <text x="20" y="145" fill="#64748b" font-family="monospace" font-size="10">00:00</text>
      <text x="230" y="145" fill="#64748b" font-family="monospace" font-size="10">12:00</text>
      <text x="430" y="145" fill="#64748b" font-family="monospace" font-size="10">23:59</text>
    </g>

    <!-- Terminal Log -->
    <g transform="translate(30, 390)">
      <rect width="470" height="105" rx="8" fill="#050e0a" stroke="#1b3d32"/>
      <text x="20" y="28" fill="#34d399" font-family="monospace" font-size="12">[WS RECV] msg={"device":"node_01", "cmd":"RELAY_2_TOGGLE"}</text>
      <text x="20" y="52" fill="#6ee7b7" font-family="monospace" font-size="12">[ACK 0x01] GPIO 05 switched HIGH in 12ms</text>
      <text x="20" y="76" fill="#38bdf8" font-family="monospace" font-size="12">[MQTT] Telemetry packet published to topic /home/power/live</text>
    </g>
  </g>
</svg>
