<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675">
  <defs>
    <linearGradient id="rag-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a121d"/>
      <stop offset="50%" stop-color="#0f1b2b"/>
      <stop offset="100%" stop-color="#15243a"/>
    </linearGradient>
    <linearGradient id="rag-card" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#17273d"/>
      <stop offset="100%" stop-color="#0e1a2b"/>
    </linearGradient>
    <pattern id="rag-grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#223753" stroke-width="0.75" stroke-opacity="0.5"/>
    </pattern>
  </defs>

  <rect width="1200" height="675" fill="url(#rag-bg)"/>
  <rect width="1200" height="675" fill="url(#rag-grid)"/>

  <!-- Top Title / Terminal Bar -->
  <rect x="40" y="30" width="1120" height="60" rx="10" fill="#101c2d" stroke="#1f3758" stroke-width="1.5"/>
  <circle cx="70" cy="60" r="6" fill="#ef4444"/>
  <circle cx="92" cy="60" r="6" fill="#f59e0b"/>
  <circle cx="114" cy="60" r="6" fill="#10b981"/>
  <text x="145" y="65" fill="#38bdf8" font-family="monospace" font-size="14" font-weight="600">rag-hh-goa // REAL-TIME VOICE SCREENING &amp; RAG EVALUATION ENGINE</text>
  <rect x="910" y="45" width="230" height="30" rx="6" fill="#0ea5e9" fill-opacity="0.15" stroke="#0ea5e9" stroke-width="1"/>
  <text x="930" y="65" fill="#38bdf8" font-family="monospace" font-size="12" font-weight="700">● FASTAPI + FAISS + WHISPER</text>

  <!-- Main Pipeline Flow Architecture -->
  <g transform="translate(40, 110)">
    <rect width="1120" height="260" rx="12" fill="url(#rag-card)" stroke="#1f3758" stroke-width="1.5"/>
    <text x="30" y="35" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="18" font-weight="700">Real-Time Conversational AI Voice Screening Topology</text>
    <text x="30" y="58" fill="#7dd3fc" font-family="monospace" font-size="12">Full-Duplex WebSockets: Mic Audio Stream → Whisper STT → FAISS Semantic Search → PyTorch LLM → Kokoro TTS</text>

    <!-- Step 1: Voice Input & Whisper STT -->
    <g transform="translate(35, 80)">
      <rect width="195" height="145" rx="8" fill="#0a1320" stroke="#38bdf8" stroke-width="1.5"/>
      <circle cx="35" cy="35" r="14" fill="#0284c7" fill-opacity="0.2"/>
      <text x="60" y="38" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="14" font-weight="700">Whisper STT</text>
      <!-- Audio Waveform -->
      <path d="M 20 70 L 40 60 L 55 85 L 70 50 L 85 90 L 100 65 L 115 80 L 135 60 L 155 75 L 175 70" stroke="#38bdf8" stroke-width="2" fill="none"/>
      <text x="20" y="110" fill="#94a3b8" font-family="monospace" font-size="11">Chunk: 250ms Audio</text>
      <text x="20" y="130" fill="#34d399" font-family="monospace" font-size="11">Latency: &lt;180ms</text>
    </g>

    <!-- Arrow 1 -->
    <path d="M 240 155 L 275 155" stroke="#38bdf8" stroke-width="2" stroke-dasharray="4,4"/>
    <polygon points="275,151 283,155 275,159" fill="#38bdf8"/>

    <!-- Step 2: FAISS Vector Retrieval -->
    <g transform="translate(290, 80)">
      <rect width="235" height="145" rx="8" fill="#0a1320" stroke="#818cf8" stroke-width="1.5"/>
      <circle cx="35" cy="35" r="14" fill="#4f46e5" fill-opacity="0.2"/>
      <text x="60" y="38" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="14" font-weight="700">FAISS Vector Index</text>
      <text x="20" y="70" fill="#94a3b8" font-family="monospace" font-size="11">IndexFlatIP / Cosine</text>
      <text x="20" y="90" fill="#c7d2fe" font-family="monospace" font-size="11">Embed: all-MiniLM-L6</text>
      <text x="20" y="110" fill="#a5b4fc" font-family="monospace" font-size="11">Top-K: 4 Context Chunks</text>
      <text x="20" y="130" fill="#34d399" font-family="monospace" font-size="11">Search Time: 12ms</text>
    </g>

    <!-- Arrow 2 -->
    <path d="M 535 155 L 570 155" stroke="#818cf8" stroke-width="2" stroke-dasharray="4,4"/>
    <polygon points="570,151 578,155 570,159" fill="#818cf8"/>

    <!-- Step 3: PyTorch LLM Inference -->
    <g transform="translate(585, 80)">
      <rect width="230" height="145" rx="8" fill="#0a1320" stroke="#10b981" stroke-width="1.5"/>
      <circle cx="35" cy="35" r="14" fill="#059669" fill-opacity="0.2"/>
      <text x="60" y="38" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="14" font-weight="700">FastAPI &amp; PyTorch</text>
      <text x="20" y="70" fill="#94a3b8" font-family="monospace" font-size="11">Context Augmentation</text>
      <text x="20" y="90" fill="#6ee7b7" font-family="monospace" font-size="11">Candidate Screening</text>
      <text x="20" y="110" fill="#a7f3d0" font-family="monospace" font-size="11">Streaming Tokens (SSE)</text>
      <text x="20" y="130" fill="#34d399" font-family="monospace" font-size="11">Output: 58 tok/sec</text>
    </g>

    <!-- Arrow 3 -->
    <path d="M 825 155 L 860 155" stroke="#10b981" stroke-width="2" stroke-dasharray="4,4"/>
    <polygon points="860,151 868,155 860,159" fill="#10b981"/>

    <!-- Step 4: Kokoro TTS Audio Stream -->
    <g transform="translate(875, 80)">
      <rect width="210" height="145" rx="8" fill="#0a1320" stroke="#f59e0b" stroke-width="1.5"/>
      <circle cx="35" cy="35" r="14" fill="#d97706" fill-opacity="0.2"/>
      <text x="60" y="38" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="14" font-weight="700">Kokoro TTS</text>
      <path d="M 20 70 L 35 85 L 50 55 L 70 80 L 85 60 L 105 85 L 125 50 L 145 75 L 165 65 L 185 70" stroke="#f59e0b" stroke-width="2" fill="none"/>
      <text x="20" y="110" fill="#fde68a" font-family="monospace" font-size="11">Low-latency Neural TTS</text>
      <text x="20" y="130" fill="#34d399" font-family="monospace" font-size="11">Audio Return: 95ms</text>
    </g>
  </g>

  <!-- Lower Section: Real-Time Screening Transcript & Metrics -->
  <g transform="translate(40, 390)">
    <!-- Real-Time Dialogue Box -->
    <rect width="700" height="245" rx="10" fill="#060c14" stroke="#1f3758" stroke-width="1.5"/>
    <rect width="700" height="32" rx="10" fill="#0f1b2b"/>
    <text x="20" y="21" fill="#7dd3fc" font-family="monospace" font-size="11">screening-session-ws // candidate_eval_stream_098</text>
    <text x="20" y="60" fill="#38bdf8" font-family="monospace" font-size="12">[AI AGENT - Kokoro]: "Could you describe how you handle database connection pooling in FastAPI?"</text>
    <text x="20" y="85" fill="#f1f5f9" font-family="monospace" font-size="12">[CANDIDATE - Whisper]: "I configure asyncpg connection pools with max_size=20 and recycle timed-out sessions."</text>
    <text x="20" y="110" fill="#a78bfa" font-family="monospace" font-size="12">[FAISS RAG]: Retrieved 3 syllabus standards (relevance_score: 0.942)</text>
    <text x="20" y="135" fill="#10b981" font-family="monospace" font-size="12">[EVALUATION SCORE]: Technical Accuracy: 9.4/10 | Communication Clarity: 8.9/10</text>
    <text x="20" y="160" fill="#e2e8f0" font-family="monospace" font-size="12">[STATUS]: Follow-up question dynamically generated in 240ms</text>
    <text x="20" y="190" fill="#34d399" font-family="monospace" font-size="12">✓ Zero jitter full-duplex WebSocket audio buffering validated</text>

    <!-- Side Metrics Panel -->
    <g transform="translate(730, 0)">
      <rect width="390" height="245" rx="10" fill="url(#rag-card)" stroke="#1f3758" stroke-width="1.5"/>
      <text x="25" y="35" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="16" font-weight="700">End-to-End Latency Benchmark</text>

      <g transform="translate(25, 55)">
        <rect width="160" height="75" rx="6" fill="#091320" stroke="#1f3758"/>
        <text x="15" y="25" fill="#7dd3fc" font-family="monospace" font-size="11">AUDIO-TO-AUDIO</text>
        <text x="15" y="55" fill="#34d399" font-family="monospace" font-size="24" font-weight="700">&lt;650ms</text>
      </g>

      <g transform="translate(205, 55)">
        <rect width="160" height="75" rx="6" fill="#091320" stroke="#1f3758"/>
        <text x="15" y="25" fill="#7dd3fc" font-family="monospace" font-size="11">RAG RECALL</text>
        <text x="15" y="55" fill="#38bdf8" font-family="monospace" font-size="24" font-weight="700">97.2%</text>
      </g>

      <g transform="translate(25, 145)">
        <rect width="340" height="75" rx="6" fill="#091320" stroke="#1f3758"/>
        <text x="15" y="25" fill="#7dd3fc" font-family="monospace" font-size="11">CONCURRENCY THROUGHPUT</text>
        <text x="15" y="52" fill="#f59e0b" font-family="monospace" font-size="20" font-weight="700">50+ Concurrent Streams</text>
      </g>
    </g>
  </g>
</svg>
