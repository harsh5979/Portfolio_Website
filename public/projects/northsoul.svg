<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f0f12"/>
      <stop offset="50%" stop-color="#141418"/>
      <stop offset="100%" stop-color="#18181f"/>
    </linearGradient>
    <linearGradient id="cyan-glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0ea5e9" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.2"/>
    </linearGradient>
    <linearGradient id="card-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e1e24"/>
      <stop offset="100%" stop-color="#16161b"/>
    </linearGradient>
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#26262e" stroke-width="0.75" stroke-opacity="0.4"/>
    </pattern>
  </defs>

  <!-- Background Canvas -->
  <rect width="1200" height="675" fill="url(#bg)"/>
  <rect width="1200" height="675" fill="url(#grid)"/>

  <!-- Top Navigation / Header Bar -->
  <rect x="40" y="30" width="1120" height="60" rx="10" fill="#18181f" stroke="#27272f" stroke-width="1.5"/>
  <circle cx="70" cy="60" r="6" fill="#ef4444"/>
  <circle cx="92" cy="60" r="6" fill="#f59e0b"/>
  <circle cx="114" cy="60" r="6" fill="#10b981"/>
  <text x="145" y="65" fill="#a1a1aa" font-family="monospace" font-size="14" font-weight="600">northsoulclothing.site/catalog // DTC E-COMMERCE ENGINE</text>
  <rect x="940" y="45" width="200" height="30" rx="6" fill="#0ea5e9" fill-opacity="0.15" stroke="#0ea5e9" stroke-width="1"/>
  <text x="965" y="65" fill="#38bdf8" font-family="monospace" font-size="12" font-weight="700">● LIVE PRODUCTION</text>

  <!-- Left Column: Apparel Catalog Showcase -->
  <g transform="translate(40, 110)">
    <rect width="520" height="525" rx="12" fill="url(#card-grad)" stroke="#2b2b36" stroke-width="1.5"/>
    <text x="25" y="40" fill="#f4f4f5" font-family="system-ui, sans-serif" font-size="20" font-weight="700">Winter Apparel Collections</text>
    <text x="25" y="65" fill="#71717a" font-family="system-ui, sans-serif" font-size="13">High-conversion product catalog with atomic inventory reservation</text>

    <!-- Product Card 1 -->
    <rect x="25" y="90" width="220" height="260" rx="10" fill="#121216" stroke="#27272f" stroke-width="1"/>
    <rect x="35" y="100" width="200" height="140" rx="6" fill="#1c1c24"/>
    <!-- Mock apparel vector graphic -->
    <path d="M 90 130 Q 135 110 180 130 L 195 160 L 175 170 L 165 150 L 165 220 L 105 220 L 105 150 L 95 170 L 75 160 Z" fill="#2d3748" stroke="#0ea5e9" stroke-width="1.5"/>
    <text x="35" y="260" fill="#f4f4f5" font-family="system-ui, sans-serif" font-size="14" font-weight="600">Heavyweight Arctic Hoodie</text>
    <text x="35" y="280" fill="#0ea5e9" font-family="monospace" font-size="13" font-weight="700">₹2,499</text>
    <rect x="35" y="300" width="200" height="36" rx="6" fill="#0ea5e9"/>
    <text x="95" y="323" fill="#09090b" font-family="system-ui, sans-serif" font-size="12" font-weight="700">Add to Bag</text>

    <!-- Product Card 2 -->
    <rect x="270" y="90" width="225" height="260" rx="10" fill="#121216" stroke="#27272f" stroke-width="1"/>
    <rect x="280" y="100" width="205" height="140" rx="6" fill="#1c1c24"/>
    <!-- Mock puffer jacket vector -->
    <path d="M 335 130 Q 382 115 430 130 L 450 165 L 430 175 L 420 155 L 420 225 L 345 225 L 345 155 L 335 175 L 315 165 Z" fill="#2d3748" stroke="#10b981" stroke-width="1.5"/>
    <text x="280" y="260" fill="#f4f4f5" font-family="system-ui, sans-serif" font-size="14" font-weight="600">Thermal Down Parka</text>
    <text x="280" y="280" fill="#10b981" font-family="monospace" font-size="13" font-weight="700">₹4,299</text>
    <rect x="280" y="300" width="205" height="36" rx="6" fill="#18181f" stroke="#0ea5e9" stroke-width="1"/>
    <text x="345" y="323" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="12" font-weight="700">Add to Bag</text>

    <!-- Cart & Session Persistence Panel -->
    <rect x="25" y="370" width="470" height="130" rx="8" fill="#121216" stroke="#27272f" stroke-width="1"/>
    <text x="45" y="400" fill="#f4f4f5" font-family="system-ui, sans-serif" font-size="14" font-weight="600">Active User Cart Synchronization</text>
    <text x="45" y="425" fill="#a1a1aa" font-family="monospace" font-size="12">UUID: usr_sess_9041x // State: Locked (3 items)</text>
    <rect x="45" y="445" width="430" height="8" rx="4" fill="#27272f"/>
    <rect x="45" y="445" width="370" height="8" rx="4" fill="#0ea5e9"/>
    <text x="45" y="480" fill="#10b981" font-family="monospace" font-size="12">✓ PhonePe Webhook Callback Listener Active</text>
  </g>

  <!-- Right Column: Checkout & Architecture Flow -->
  <g transform="translate(585, 110)">
    <rect width="575" height="525" rx="12" fill="url(#card-grad)" stroke="#2b2b36" stroke-width="1.5"/>
    <text x="30" y="40" fill="#f4f4f5" font-family="system-ui, sans-serif" font-size="20" font-weight="700">Production E-Commerce Architecture</text>
    <text x="30" y="65" fill="#71717a" font-family="system-ui, sans-serif" font-size="13">End-to-End order pipeline: Client → REST Gateway → PhonePe PG → Inventory</text>

    <!-- Node 1: React Client -->
    <rect x="30" y="100" width="150" height="80" rx="8" fill="#13131a" stroke="#0ea5e9" stroke-width="1.5"/>
    <text x="45" y="130" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="13" font-weight="700">React.js Client</text>
    <text x="45" y="150" fill="#a1a1aa" font-family="monospace" font-size="11">Google OAuth 2.0</text>
    <text x="45" y="165" fill="#71717a" font-family="monospace" font-size="10">Cart Cache Sync</text>

    <!-- Arrow 1 -->
    <path d="M 180 140 L 225 140" stroke="#0ea5e9" stroke-width="2" stroke-dasharray="4,4"/>
    <polygon points="225,136 233,140 225,144" fill="#0ea5e9"/>

    <!-- Node 2: Node.js / Express -->
    <rect x="235" y="100" width="150" height="80" rx="8" fill="#13131a" stroke="#10b981" stroke-width="1.5"/>
    <text x="250" y="130" fill="#34d399" font-family="system-ui, sans-serif" font-size="13" font-weight="700">Node/Express</text>
    <text x="250" y="150" fill="#a1a1aa" font-family="monospace" font-size="11">API Gateway</text>
    <text x="250" y="165" fill="#71717a" font-family="monospace" font-size="10">Rate Limiter</text>

    <!-- Arrow 2 -->
    <path d="M 385 140 L 420 140" stroke="#10b981" stroke-width="2" stroke-dasharray="4,4"/>
    <polygon points="420,136 428,140 420,144" fill="#10b981"/>

    <!-- Node 3: PhonePe Gateway -->
    <rect x="430" y="100" width="115" height="80" rx="8" fill="#13131a" stroke="#a855f7" stroke-width="1.5"/>
    <text x="442" y="130" fill="#c084fc" font-family="system-ui, sans-serif" font-size="13" font-weight="700">PhonePe PG</text>
    <text x="442" y="150" fill="#a1a1aa" font-family="monospace" font-size="11">SHA256 Sign</text>
    <text x="442" y="165" fill="#71717a" font-family="monospace" font-size="10">Callback URL</text>

    <!-- Bottom Metrics Grid -->
    <g transform="translate(30, 210)">
      <rect width="250" height="120" rx="8" fill="#121217" stroke="#27272f" stroke-width="1"/>
      <text x="20" y="35" fill="#71717a" font-family="monospace" font-size="12">ORDER SUCCESS RATE</text>
      <text x="20" y="75" fill="#10b981" font-family="monospace" font-size="32" font-weight="700">99.8%</text>
      <text x="20" y="100" fill="#a1a1aa" font-family="system-ui, sans-serif" font-size="11">Zero dropped webhook sessions</text>

      <rect x="265" width="250" height="120" rx="8" fill="#121217" stroke="#27272f" stroke-width="1"/>
      <text x="285" y="35" fill="#71717a" font-family="monospace" font-size="12">CATALOG API LATENCY</text>
      <text x="285" y="75" fill="#0ea5e9" font-family="monospace" font-size="32" font-weight="700">&lt;140ms</text>
      <text x="285" y="100" fill="#a1a1aa" font-family="system-ui, sans-serif" font-size="11">Indexed MongoDB aggregations</text>
    </g>

    <!-- Terminal Output Box -->
    <g transform="translate(30, 355)">
      <rect width="515" height="145" rx="8" fill="#0d0d10" stroke="#27272f" stroke-width="1"/>
      <text x="20" y="28" fill="#a1a1aa" font-family="monospace" font-size="11">// Production Webhook Event Stream</text>
      <text x="20" y="52" fill="#10b981" font-family="monospace" font-size="12">[200 OK] POST /api/payment/phonepe-callback - Order #NS-89241</text>
      <text x="20" y="74" fill="#38bdf8" font-family="monospace" font-size="12">[AUTH] OAuth token validated for session usr_88190</text>
      <text x="20" y="96" fill="#eab308" font-family="monospace" font-size="12">[INVENTORY] Atomic decrement executed: SKU-HOODIE-M (-1)</text>
      <text x="20" y="118" fill="#71717a" font-family="monospace" font-size="12">[DISPATCH] Automated shipping label generated via logistics API</text>
    </g>
  </g>
</svg>
